# The bootstrap commit of the last sync. repo-sync writes it.
bootstrap_commit = "696150bea25a2cb77650c2c10ab16a7b69161be0"
# The mise environments: dev (necessary) and ci.
environments = [ "dev" ]
# The VS Code extensions that no tool has.
extensions = [ "bmalehorn.vscode-fish", "davidanson.vscode-markdownlint" ]
repo_name = "macos-setup"
# The web URL of the repository.
repo_url = "https://github.com/virajp/macos-setup"

[tools.claude]
# A feature branch merges into main, with a local merge.
[branch.main]
direct_commit = true

# The repository's own ignore lines, added at the end of the shared .gitignore.
[overrides.gitignore]
add = [ "/backup/" ]
