[settings]
activate_aggressive = true
all_compile         = false
env_shell_expand    = true
gpg_verify          = true
raw                 = true
task.output         = "interleave"

# Package manager settings
npm.package_manager = "pnpm"
python.compile      = false
python.uv_venv_auto = "create|source"

[tools]
dprint     = { version = "0.57.4" }
node       = { version = "26.10.0" }
pnpm       = { version = "12.6.0" }
pre-commit = { version = "4.6.2" }
taplo      = { version = "0.10.0" }

[tasks.init]
description = "Initialize mise tasks"
hide        = true
run         = "find $MISE_ORIGINAL_CWD/.config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"

[shell_alias]
lint  = "mise run code:lint"
setup = "mise run setup:all"
