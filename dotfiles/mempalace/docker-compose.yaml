name: mempalace

services:
  # Vector store behind mempalace.
  qdrant:
    container_name: qdrant
    image: docker.io/qdrant/qdrant:latest
    pull_policy: missing
    restart: unless-stopped
    # Loopback-only: MemPalace runs on the host under pitchfork,
    # not on this network. Never bare 6333:6333 — that binds 0.0.0.0.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      # Bind mount, not a named volume — `mempalace-qdrant:stop` (via pitchfork)
      # sends SIGTERM to `docker compose up`, which stops but never removes
      # volumes; a bind mount is the safer choice regardless, since it
      # survives even a manual `docker compose down --volumes`.
      - "${HOME}/.local/share/qdrant:/qdrant/storage"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'" ]
      interval: 5s
      timeout: 3s
      retries: 10
