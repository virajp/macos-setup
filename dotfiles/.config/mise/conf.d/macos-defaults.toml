# App updates, auto quit, Bluetooth sleep, cleaners
appUpdatesCheckFrequency = "daily"
autoQuitEnabled = true
bluetoothSleepEnabled = true
uninstallerCommandBarEnabled = true
urlCleanerEnabled = true
whatsAppDownloadsEnabled = false
whatsAppDownloadsRetentionDays = 7
whatsAppOrganizerDelayMinutes = 5

# Keep awake
clamshellPreferred = true # closed-lid mode for every session
defaultDurationMinutes = 0 # indefinitely
keepAwakeActiveIcon = "vorssaint"
keepAwakeAllowDisplaySleep = false # keep the display on for remote Screen Sharing
keepAwakeAutoStart = true # start keep-awake when the app launches
keepAwakeIconTint = "pink"
keepAwakeMouseJiggleIntervalMinutes = 5
keepAwakeRightClickToggle = true
keepAwakeSwitchUsesUntil = false

# Clipboard
clipboardAutoClearDelaySeconds = 20
clipboardHistoryLimit = 50
clipboardHistoryMenuBarPreviewLength = 20

# Dock click, Finder cut/paste, music block
dockClickHide = false
dockClickMinimize = true
finderCutPasteEnabled = true
musicBlockEnabled = true

# Menu bar metrics
menuBarBattery = false
menuBarBatteryTemperature = false
menuBarCPU = false
menuBarCPUTemperature = false
menuBarGPU = false
menuBarHideIconWithMetrics = false
menuBarMetricAppearance = "values"
menuBarNetwork = true
menuBarPeripheralBattery = false
menuBarSeparateMetrics = true
menuBarUsageBarCriticalColor = "#FF453A"
menuBarUsageBarElevatedColor = "#FFD60A"
menuBarUsageBarHighThreshold = 90
menuBarUsageBarMediumThreshold = 70
menuBarUsageBarNormalColor = "#64D2FF"

# System monitor alerts
batteryLimitPercent = 20
monitorAlertBattery = true
monitorAlertBatteryPercent = 25
monitorAlertBatteryTemperature = true
monitorAlertBatteryTemperatureThreshold = 40
monitorAlertCPU = true
monitorAlertCPUTemperature = true
monitorAlertCPUTemperatureThreshold = 90
monitorAlertCPUThreshold = 90
monitorAlertCooldownMinutes = 15
monitorAlertDisk = true
monitorAlertDiskFreePercent = 25
monitorAlertMemory = true
monitorIntervalSeconds = 5
monitorMemoryMetric = "used"
monitorPwrTemperature = true

# Notch
notchAccessoriesEnabled = true
notchDownloadsEnabled = true
notchHidesMenuBarIcon = false
notchKeyboardLightControlHidden = true
notchLiquidGlassEnabled = false
notchScratchpadControlHidden = true
notchSize = "spacious"

# Panel, radial menu, switcher, scrolling
panelControlFilesExpanded = false
panelControlInputExpanded = false
panelControlWindowsExpanded = false
radialMenuActivationMode = "pressOrHold"
radialMenuAtPointer = false
radialMenuEnabled = true
scrollInverterHorizontalEnabled = false
switcherPreviewExcludedApps = []
switcherPreviewSize = "normal"
systemShortcutTakeOverKeys = []

# Window layout shortcuts and maximizer
windowLayoutShortcutBottomLeft = "none"
windowLayoutShortcutBottomRight = "none"
windowLayoutShortcutCenter = "none"
windowLayoutShortcutCenterThird = "none"
windowLayoutShortcutLeftThird = "none"
windowLayoutShortcutLeftTwoThirds = "none"
windowLayoutShortcutMaximize = "option+command:3"
windowLayoutShortcutPreviousDisplay = "control+option+command:123"
windowLayoutShortcutRestore = "none"
windowLayoutShortcutRightThird = "none"
windowLayoutShortcutRightTwoThirds = "none"
windowLayoutShortcutTopLeft = "none"
windowLayoutShortcutTopRight = "none"
windowLayoutShortcutsEnabled = true
windowMaximizeEnabled = true
windowMaximizeExcludedApps = [ "com.stablyai.orca", "dev.warp.Warp-Stable" ]

[bootstrap.hooks.post-defaults]
run = """
# defaults values are not templated, and $HOME must not be hardcoded
defaults write com.apple.finder NewWindowTargetPath -string "file://$HOME/"
chflags nohidden ~/Library
killall cfprefsd || true
killall Finder || true
killall Dock || true
killall SystemUIServer || true
killall ControlCenter || true
"""
