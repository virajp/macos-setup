[bootstrap.packages]
# Cask
"brew-cask:github" = "latest" # Desktop client for GitHub repositories

# Formulas
"brew:diff-so-fancy" = "latest" # Enhances git diff output
"brew:gh"            = "latest" # GitHub CLI tool
"brew:git"           = "latest" # Distributed version control system
"brew:git-tools"     = "latest" # Additional Git utilities
"brew:glab"          = "latest" # GitLab CLI tool
"brew:lazygit"       = "latest" # Simple terminal UI for git

[dotfiles]
# Git configuration; identity files are templates rendered from the [vars] in identity.toml
"~/.config/git/allowed_signers" = { mode = "template" }
"~/.config/git/config"          = {}
"~/.config/git/github.config"   = { mode = "template" }
"~/.config/git/gitlab.config"   = { mode = "template" }
"~/.config/git/identity"        = { mode = "template" }
"~/.config/git/ignore"          = {}

# GitHub Copilot
"~/.github/git-commit-guidelines.md" = {}

# GitHub CLI; a template: the editor comes from the [vars] in identity.toml
[bootstrap.files."~/.config/gh/config.yml"]
content = """
version: "1"
# WHY: Use SSH for git operations instead of HTTPS for better security with keys
# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: ssh
# WHY: VS Code as default editor for consistency with development environment
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor: {{ vars.editor }}
# When to interactively prompt. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prompt: enabled
# A pager program to send command output to, e.g. "less". Set the value to "cat" to disable the pager.
pager: less
# WHY: Aliases for commonly used commands to speed up workflow
# Aliases allow you to create nicknames for gh commands
aliases:
  co: pr checkout
"""
template = true

[shell_alias]
# Git Related Aliases
diff  = "diff-so-fancy"
gc    = 'git commit -a -m'
gp    = 'git push --verbose'
gpull = 'git pull --all --verbose --progress'
gs    = 'git status -sb'
