# Global mise config, loaded from ~/.config/mise/conf.d/. Machine state applied
# by `mise bootstrap` (from any directory); settings/tools/env stay in
# ../config.toml.
# Touch ID for sudo. /etc/pam.d/sudo is overwritten by every macOS update;
# sudo_local is the drop-in it includes and survives them.
[bootstrap.files."/etc/pam.d/sudo_local"]
content = "auth       sufficient     pam_tid.so\n"
group   = "wheel"
mode    = "0444"
owner   = "root"

# fish as login shell (mise adds it to /etc/shells first). Homebrew's bash and
# zsh are added to /etc/shells by the line entries below.
[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

# qdrant vector store behind mempalace (needs OrbStack running). project_dir
# must be a literal absolute path (mise expands neither ~ nor $HOME nor
# templates here), hence the username. No depends_on: orbstack is a cask,
# installed by brew:casks, not a declared package.
[bootstrap.compose.mempalace]
files        = [ "docker-compose.yaml" ]
project_dir  = "/Users/virajpatel/.config/mempalace"
project_name = "mempalace"
state        = "running"
sudo         = false

[dotfiles]
# Homebrew shells in /etc/shells (fish is handled by [bootstrap.user])
"/etc/shells/brew-bash" = { line = "/opt/homebrew/bin/bash" }
"/etc/shells/brew-zsh"  = { line = "/opt/homebrew/bin/zsh" }
