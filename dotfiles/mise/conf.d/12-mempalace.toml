[tools."pipx:mempalace"]
depends = [ "python", "uv" ]
uvx     = true
version = "3.10.0"

# Docker Compose for qdrant (mempalace dependency)
[bootstrap.compose.mempalace]
files        = [ "docker-compose.yaml" ]
project_dir  = "/Users/virajpatel/.config/mempalace"
project_name = "mempalace"
state        = "running"
sudo         = false

[bootstrap.macos.launchd.agents.mempalace-hub]
args              = [ "x", "--", "mempalace", "serve" ]
environment       = { MEMPALACE_MCP_IDLE_HOURS = "0", PATH = "/opt/homebrew/bin:/usr/bin:/bin" }
keep_alive        = true
kickstart         = true
program           = "/opt/homebrew/bin/mise"
run_at_load       = true
stderr_path       = "~/Library/Logs/mempalace-hub.log"
stdout_path       = "~/Library/Logs/mempalace-hub.log"
throttle_interval = 10
working_directory = "~"

[bootstrap.directories."~/.config/mempalace"]

[bootstrap.files."~/.config/mempalace/docker-compose.yaml"]
content = """
name: mempalace

services:
  # Vector store behind mempalace.
  qdrant:
    container_name: qdrant
    image: docker.io/qdrant/qdrant:latest
    pull_policy: missing
    restart: unless-stopped
    # Loopback-only: MemPalace runs on the host, not on this network.
    # Never bare 6333:6333 — that binds 0.0.0.0.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      # Bind mount, not a named volume — it survives even a manual
      # `docker compose down --volumes`.
      - "${HOME}/.local/share/qdrant:/qdrant/storage"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - net

networks:
  net:
    driver: bridge
"""

[env]
# Mempalace Backend
MEMPALACE_BACKEND          = "qdrant"
MEMPALACE_EMBEDDING_DEVICE = "auto"
MEMPALACE_EMBEDDING_MODEL  = "embeddinggemma"
MEMPALACE_MAX_BACKUPS      = 4
MEMPALACE_MCP_IDLE_HOURS   = 0
MEMPALACE_PALACE_PATH      = "~/.local/share/mempalace"
MEMPALACE_QDRANT_URL       = "http://127.0.0.1:6333"

[shell_alias]
mp = "mise x -- fnox exec --profile mempalace -- mempalace"
