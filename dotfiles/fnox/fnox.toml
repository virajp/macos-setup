env = "exec"

[providers]
global = { prefix = "global/", service = "fnox", type = "keychain" }

[secrets]
CONTEXT7_API_KEY          = { env = true, provider = "global", value = "CONTEXT7_API_KEY" }
GITHUB_API_TOKEN          = { env = true, provider = "global", value = "GITHUB_API_TOKEN" }
HOMEBREW_GITHUB_API_TOKEN = { env = true, provider = "global", value = "GITHUB_API_TOKEN" }
