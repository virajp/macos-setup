# macOS settings, applied with `mise bootstrap macos defaults apply`. References:
#   - https://www.defaults-write.com/
#   - https://mac.install.guide/mac-setup/finder/
# `defaults read <domain> [<key>]` shows the live value. pmset/nvram live in the
# macos:power task (run as the `bootstrap` task below) — mise only does
# `defaults`, and it never restarts apps itself, hence the post-defaults hook.

# General & Appearance
[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyle              = "Dark" # system-wide Dark appearance
AppleMiniaturizeOnDoubleClick    = false  # no minimize on title-bar double-click
AppleShowAllExtensions           = true
NSAutomaticCapitalizationEnabled = false
NSQuitAlwaysKeepsWindows         = true   # reopen windows after quit/restart
"com.apple.mouse.tapBehavior"    = 1      # tap-to-click
"com.apple.trackpad.forceClick"  = false

# Finder
[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles              = false  # toggle with Cmd+Shift+.
CreateDesktop                  = false  # hide desktop icons (pre-Sonoma key)
FK_AppCentricShowSidebar       = true
FXArrangeGroupViewBy           = "Name"
FXDefaultSearchScope           = "SCcf" # search the current folder
FXEnableExtensionChangeWarning = false
# FXEnableRemoveFromICloudDriveWarning: not declared — true is the default and
# Finder drops the key on restart, so it would always report as unset.
FXICloudDriveDesktop            = true
FXICloudDriveDocuments          = true
FXICloudDriveEnabled            = true
FXPreferredGroupBy              = "Kind"
FXPreferredSearchViewStyle      = "Nlsv"
FXPreferredViewStyle            = "Nlsv" # list view
FXRemoveOldTrashItems           = true   # purge trash after 30 days
FinderSpawnTab                  = false  # folders open in windows, not tabs
NewWindowTarget                 = "PfHm" # new windows open at $HOME (path set in post-defaults hook)
QuitMenuItem                    = false
ShowExternalHardDrivesOnDesktop = false
ShowHardDrivesOnDesktop         = false
ShowMountedServersOnDesktop     = false
ShowPathbar                     = true
ShowRecentTags                  = false
ShowRemovableMediaOnDesktop     = false
ShowSidebar                     = true
ShowStatusBar                   = true
ShowTabView                     = true
WarnOnEmptyTrash                = false
_FXSortFoldersFirst             = true
_FXSortFoldersFirstOnDesktop    = true

# No .DS_Store on network and USB volumes
[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores     = true

# Dock & Mission Control
[bootstrap.macos.defaults."com.apple.dock"]
autohide                = true
expose-group-apps       = true     # group windows by app in Mission Control
largesize               = 71
magnification           = true
minimize-to-application = true
mru-spaces              = false    # don't rearrange Spaces by recent use
orientation             = "right"
show-process-indicators = true
show-recents            = false
tilesize                = 38
windowtabbing           = "always"
# Hot corners: all four disabled (0 = no-op)
wvous-bl-corner   = 0
wvous-bl-modifier = 0
wvous-br-corner   = 0
wvous-br-modifier = 0
wvous-tl-corner   = 0
wvous-tl-modifier = 0
wvous-tr-corner   = 0
wvous-tr-modifier = 0

# Window management
[bootstrap.macos.defaults."com.apple.WindowManager"]
AppWindowGroupingBehavior      = true  # show all of an app's windows on switch
ClickedWallpaperRevealsDesktop = 2     # only with Stage Manager
EnableTiledWindowMargins       = false
EnableTilingByEdgeDrag         = false
EnableTopTilingByEdgeDrag      = false
HideDesktop                    = true  # Sonoma+ equivalent of CreateDesktop=false

# Menu bar clock: day of week and AM/PM, no date
[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowAMPM      = true
ShowDate      = 0
ShowDayOfWeek = true

# Trackpad: tap-to-click on, three-finger tap lookup off (internal + Bluetooth)
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking                      = true
TrackpadThreeFingerTapGesture = 0

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking                      = true
TrackpadThreeFingerTapGesture = 0

# Clamp streaming quality on battery
[bootstrap.macos.defaults."com.apple.appleinterface"]
videoStreamingOptimizeOnBattery = true

[bootstrap.hooks]
post-defaults = [
# defaults values are not templated, and $HOME must not be hardcoded
'defaults write com.apple.finder NewWindowTargetPath -string "file://$HOME/"',
"chflags nohidden ~/Library",
"killall cfprefsd || true",
"killall Finder || true",
"killall Dock || true",
"killall SystemUIServer || true",
"killall ControlCenter || true",
]
post-packages = [ "mise run brew:extras", "mise run vscode:extensions" ]

# Touch ID for sudo. /etc/pam.d/sudo is overwritten by every macOS update;
# sudo_local is the drop-in it includes and survives them.
[bootstrap.files."/etc/pam.d/sudo_local"]
content = "auth       sufficient     pam_tid.so\n"
group   = "wheel"
mode    = "0444"
owner   = "root"

# fish as login shell (mise adds it to /etc/shells first). Homebrew's bash and
# zsh are added to /etc/shells by the line entries at the end of [dotfiles].
[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

# qdrant vector store behind mempalace (needs OrbStack running). Pitchfork
# (dotfiles/pitchfork) still supervises mempalace-mcp itself; it only waits for
# this container's port. project_dir must be a literal absolute path (mise
# expands neither ~ nor $HOME nor templates here), hence the username. No
# depends_on: orbstack is installed by brew:extras, not a declared package.
[bootstrap.compose.mempalace]
files        = [ "docker-compose.yaml" ]
project_dir  = "/Users/virajpatel/Projects/github.com/virajp/macos-setup/dotfiles/mempalace"
project_name = "mempalace"

# Runs last in `mise bootstrap`: prompts for sudo (pmset/nvram)
[tasks.bootstrap]
description = "Apply the pmset/nvram power profile"
hide        = true
run         = "mise run macos:power"

[dotfiles]
# ZSH
"~/.config/zsh" = { mode = "symlink", source = "zsh/scripts" }
"~/.zshenv"     = { mode = "symlink", source = "zsh/.zshenv" }
"~/.zshrc"      = { mode = "symlink", source = "zsh/.zshrc" }

# Fish
"~/.config/fish/conf.d"      = { mode = "symlink", source = "fish/conf.d" }
"~/.config/fish/config.fish" = { mode = "symlink", source = "fish/config.fish" }
"~/.config/fish/functions"   = { mode = "symlink", source = "fish/functions" }

# Claude
"~/.claude/CLAUDE.md"     = { mode = "symlink", source = "ai-tools/claude/CLAUDE.md" }
"~/.claude/output-styles" = { mode = "symlink", source = "ai-tools/claude/output-styles" }
"~/.claude/settings.json" = { mode = "symlink", source = "ai-tools/claude/settings.json" }

# GitHub Copilot
"~/.github/git-commit-guidelines.md" = { mode = "symlink", source = "ai-tools/copilot/git-commit-guidelines.md" }

# 1Password
"~/.config/1Password/ssh/agent.toml" = { mode = "symlink", source = "1Password/agent.toml" }

# dprint & Taplo
"~/.config/dprint.json" = { mode = "symlink", source = "dprint/dprint.json" }
"~/.config/taplo.toml"  = { mode = "symlink", source = "dprint/taplo.toml" }

# fnox
"~/fnox.toml" = { mode = "symlink", source = "fnox/fnox.toml" }

# Gem
"~/.gemrc" = { mode = "symlink", source = "gem/.gemrc" }

# Ghostty
"~/.config/ghostty/config" = { mode = "symlink", source = "ghostty/config" }

# Git & SSH
"~/.gitconfig"        = { mode = "symlink", source = "git/gitconfig" }
"~/.gitignore_global" = { mode = "symlink", source = "git/gitignore_global" }
"~/.ssh"              = { mode = "symlink-each", source = "ssh" }

# GitHub CLI
"~/.config/gh" = { mode = "symlink-each", source = "github" }

# Mempalace (dockerfile & compose)
"~/.config/mempalace" = { mode = "symlink", source = "mempalace" }

# Mise (user level)
"~/.config/mise" = { mode = "symlink", source = "mise" }

# oh-my-posh
"~/.config/oh-my-posh" = { mode = "symlink", source = "oh-my-posh" }

# Pitchfork
"~/.config/pitchfork" = { mode = "symlink", source = "pitchfork" }

# PNPM
"~/Library/Preferences/pnpm/config.yaml" = { mode = "symlink", source = "pnpm/config.yaml" }

# Starship
"~/.config/starship.toml" = { mode = "symlink", source = "starship/starship.toml" }

# Warp (Tabs Config)
"~/.warp/tab_configs" = { mode = "symlink", source = "warp/tab_configs" }

# Homebrew shells in /etc/shells (fish is handled by [bootstrap.user])
"/etc/shells/brew-bash" = { line = "/opt/homebrew/bin/bash" }
"/etc/shells/brew-zsh"  = { line = "/opt/homebrew/bin/zsh" }
