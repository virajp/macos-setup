# Homebrew formulae, casks and Mac App Store apps. mise installs these itself
# (bottles poured into /opt/homebrew, casks adopted when already present);
# `brew` stays installed for `brew services` (tailscale) and upgrades.
# 1password and orbstack stay on the real `brew` CLI (brew:extras task, run from
# the post-packages hook): they must live in /Applications, which mise cannot
# express per-cask (only MISE_BREW_CASK_OPT_APPDIR). VS Code extensions
# (vscode:extensions) have no mise manager and run from the same hook.
# Third-party taps are deliberately absent: mise evaluates them with its own
# Ruby DSL shim, which fails on real-world casks/formulae. claude-status comes
# from npm (upgrade:ai), orca is installed by hand.
[bootstrap.brew]
adopt = true

[bootstrap.packages]
# Formulaes
"brew:bash"            = "latest" # Latest version of bash
"brew:bat"             = "latest" # Alternative to cat
"brew:btop"            = "latest" # Resource monitor for the terminal
